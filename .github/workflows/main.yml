name: Run Tests and Publish Docker Image

on:
  push:
    branches: [ master, dev ]
    pull_request:
      branches: [ master, dev ]
      types: [ opened, synchronize ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools<82" wheel
        pip install --no-build-isolation cx_Oracle==8.3.0
        pip install -r requirements.txt
      working-directory: ./lintuasema-backend
    - name: Test backend with pytest
      env:
        SECRET_KEY: 'secretkey'
      run: |
        python3 -m pytest
      working-directory: ./lintuasema-backend
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Install frontend packages
      run: npm install
      working-directory: ./frontend
    - name: Lint frontend
      run: npm run lint
      working-directory: ./frontend
    - name: Run frontend tests
      run: npm test
      working-directory: ./frontend
    - name: Build & copy frontend to backend
      run: npm run build-copy
      working-directory: ./frontend
    - name: Run backend
      env:
        AUTH_TOKEN: ${{ secrets.TEST_CONFIG_AUTH_TOKEN }}
        TARGET: ${{ secrets.TEST_CONFIG_TARGET }}
        LAJI_AUTH_URL: ${{ secrets.TEST_CONFIG_LAJI_AUTH_URL }}
        LAJI_API_URL:  ${{ secrets.TEST_CONFIG_LAJI_API_URL }}
        SECRET_KEY: 'secretkey'
      run: flask run --port=3000 &
      working-directory: ./lintuasema-backend
    - name: Run Cypress tests
      env:
        cypress_person_token: ${{ secrets.CYPRESS_PERSON_TOKEN }}
      run: |
        sleep 10
        npm run cypress:cmd
      working-directory: ./frontend

    - name: Save Cypress screenshots if fails
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-screenshots
        path: frontend/cypress/screenshots/
    - name: Save Cypress videos if fails
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-videos
        path: frontend/cypress/videos/

  build:
    if: ${{ github.event_name == 'push' && contains(join(github.event.commits.*.message, ', '), '#skip') == false }}
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ./Dockerfile
          build-args: |
            target=prod
