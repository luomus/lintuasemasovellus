kind: Template
apiVersion: template.openshift.io/v1
parameters:
  - name: APP
    required: true
    value: bird-station-app
  - name: BRANCH
    required: true
    value: dev
  - name: HOST
    required: true
  - name: AUTH_TOKEN
    required: true
  - name: TARGET
    required: true
  - name: USERNAME
    required: true
  - name: PASSWORD
    required: true
  - name: HOSTNAME
    required: true
  - name: SERVICE_NAME
    required: true
  - name: LAJI_API_URL
    required: true
  - name: LAJI_AUTH_URL
    required: true
  - name: SECRET_KEY
    required: true
  - name: EMAIL_HOST
    required: true
  - name: SERVER_EMAIL
    required: true
  - name: ADMIN_EMAIL
    required: true
  - name: CPU_LIMIT
    required: true
    value: "100m"
  - name: MEMORY_LIMIT
    required: true
    value: "500Mi"
metadata:
  name: ${APP}-${BRANCH}
objects:
  - kind: Secret
    apiVersion: v1
    metadata:
      name: ${APP}-${BRANCH}
      labels:
        app: ${APP}-${BRANCH}
    data:
      AUTH_TOKEN: ${AUTH_TOKEN}
      TARGET: ${TARGET}
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
      HOSTNAME: ${HOSTNAME}
      SERVICE_NAME: ${SERVICE_NAME}
      LAJI_AUTH_URL: ${LAJI_AUTH_URL}
      LAJI_API_URL: ${LAJI_API_URL}
      SECRET_KEY: ${SECRET_KEY}
      EMAIL_HOST: ${EMAIL_HOST}
      SERVER_EMAIL: ${SERVER_EMAIL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: ${APP}-${BRANCH}
      labels:
        app: ${APP}-${BRANCH}
    spec:
      selector:
        matchLabels:
          app: ${APP}-${BRANCH}
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app: ${APP}-${BRANCH}
        spec:
          containers:
            - name: ${APP}-${BRANCH}
              resources:
                limits:
                  cpu: ${CPU_LIMIT}
                  memory: ${MEMORY_LIMIT}
              env:
                - name: AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ${APP}-${BRANCH}
                      key: AUTH_TOKEN
                - name: TARGET
                  valueFrom:
                    secretKeyRef:
                      name: ${APP}-${BRANCH}
                      key: TARGET
                - name: LINTUASEMA_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: ${APP}-${BRANCH}
                      key: USERNAME
                - name: PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${APP}-${BRANCH}
                      key: PASSWORD
                - name: HOSTNAME
                  valueFrom:
                    secretKeyRef:
                      name: ${APP}-${BRANCH}
                      key: HOSTNAME
                - name: SERVICE_NAME
                  valueFrom:
                    secretKeyRef:
                      name: ${APP}-${BRANCH}
                      key: SERVICE_NAME
                - name: LAJI_API_URL
                  valueFrom:
                    secretKeyRef:
                      name: ${APP}-${BRANCH}
                      key: LAJI_API_URL
                - name: LAJI_AUTH_URL
                  valueFrom:
                    secretKeyRef:
                      name: ${APP}-${BRANCH}
                      key: LAJI_AUTH_URL
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ${APP}-${BRANCH}
                      key: SECRET_KEY
                - name: EMAIL_HOST
                  valueFrom:
                    secretKeyRef:
                      name: ${APP}-${BRANCH}
                      key: EMAIL_HOST
                - name: SERVER_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: ${APP}-${BRANCH}
                      key: SERVER_EMAIL
                - name: ADMIN_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: ${APP}-${BRANCH}
                      key: ADMIN_EMAIL
                - name: DB_TYPE
                  value: "oracle"
                - name: BEHIND_PROXY
                  value: "True"
              ports:
                - containerPort: 3000
                  protocol: TCP
              imagePullPolicy: Always
              image: ghcr.io/luomus/lintuasemasovellus:${BRANCH}
  - kind: Service
    apiVersion: v1
    metadata:
      name: ${APP}-${BRANCH}
      labels:
        app: ${APP}-${BRANCH}
    spec:
      ports:
        - name: "8080"
          protocol: TCP
          port: 8080
          targetPort: 3000
      selector:
        app: ${APP}-${BRANCH}
  - kind: Route
    apiVersion: route.openshift.io/v1
    metadata:
      name: ${APP}-${BRANCH}
      labels:
        app: ${APP}-${BRANCH}
    spec:
      host: ${HOST}
      to:
        kind: Service
        name: ${APP}-${BRANCH}
        weight: 100
      port:
        targetPort: 8080
      tls:
        termination: edge
      wildcardPolicy: None
